name: windows-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check source formatting
        run: |
          npm run format:check
          cargo fmt --manifest-path native/posixloom-host/Cargo.toml -- --check

      - name: Run TypeScript and Native Host tests
        run: |
          cargo build --release --locked --manifest-path native/posixloom-host/Cargo.toml
          npm test
          cargo test --locked --manifest-path native/posixloom-host/Cargo.toml

      - name: Assemble and verify development package
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'posixloom 开发包'
          ./packaging/build-runtime.ps1 -Mode development -Output $output -SkipArchive
          ./packaging/verify-runtime.ps1 -PackageRoot $output
