[package]
name = "posixloom-host"
version = "0.1.0"
edition = "2021"
description = "Native process and Job Object host for PosixLoom Runtime"
license = "MIT"

[[bin]]
name = "posixloom"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_System_Pipes",
] }
