name: windows-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check source formatting
        run: |
          npm run format:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --manifest-path native/posixloom-host/Cargo.toml -- --check

      - name: Run TypeScript and Native Host tests
        run: |
          cargo clippy --locked --all-targets --manifest-path native/posixloom-host/Cargo.toml -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release --locked --manifest-path native/posixloom-host/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path native/posixloom-host/Cargo.toml

      - name: Assemble and verify development package
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'posixloom 开发包'
          ./packaging/build-runtime.ps1 -Mode development -Output $output -SkipArchive
          ./packaging/verify-runtime.ps1 -PackageRoot $output

      - name: Check cold and warm performance budgets
        run: node scripts/benchmark.mjs --samples 7 --warmup 2 --check --output artifacts/benchmark-ci.json

      - name: Check the actual HTTP output transport
        run: node scripts/benchmark.mjs --case load.http-output-64mib --samples 3 --warmup 1 --check --output artifacts/benchmark-http-ci.json

      - name: Show performance evidence
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath artifacts/benchmark-ci.json) {
            Get-Content -LiteralPath artifacts/benchmark-ci.json
            Get-Content -LiteralPath artifacts/benchmark-ci.json | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          if (Test-Path -LiteralPath artifacts/benchmark-http-ci.json) {
            Get-Content -LiteralPath artifacts/benchmark-http-ci.json | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
